name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CVC5_VERSION: "1.3.1"
  # Must match the Noir revision `acir` is pinned to in Cargo.toml
  # (9cdc608 = v1.0.0-rc.4), or artifacts fail to deserialize.
  NARGO_VERSION: "v1.0.0-rc.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      # Building cvc5 from source takes tens of minutes; the official static
      # release already carries CoCoA, which is all the finite-field backend
      # needs. Keep the version in step with `[package.metadata.cvc5]` in
      # `cvc5-ff-sys`.
      - name: Fetch prebuilt cvc5
        run: |
          set -euo pipefail
          archive="cvc5-Linux-x86_64-static-gpl"
          curl -sSfL -o cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/${archive}.zip"
          unzip -q cvc5.zip
          echo "CVC5_LIB_DIR=$PWD/${archive}/lib" >> "$GITHUB_ENV"
          echo "CVC5_INCLUDE_DIR=$PWD/${archive}/include" >> "$GITHUB_ENV"

      # The corpus scripts recompile Noir packages, so they need nargo.
      # Noir publishes binaries only for some tags (none for v1.0.0-rc.1 to
      # rc.4), so fall back to building the tag from source, cached per tag.
      - name: Cache nargo
        id: nargo-cache
        uses: actions/cache@v4
        with:
          path: .nargo-bin
          key: nargo-${{ env.NARGO_VERSION }}-${{ runner.os }}

      - name: Fetch or build nargo
        if: steps.nargo-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.nargo-bin/bin"
          url="https://github.com/noir-lang/noir/releases/download/${NARGO_VERSION}/nargo-x86_64-unknown-linux-gnu.tar.gz"
          if curl -sSfL -o nargo.tar.gz "$url"; then
            tar -xzf nargo.tar.gz -C "$PWD/.nargo-bin/bin"
          else
            cargo install --locked --git https://github.com/noir-lang/noir \
              --tag "${NARGO_VERSION}" nargo_cli --root "$PWD/.nargo-bin"
          fi

      - name: Use nargo
        run: |
          "$PWD/.nargo-bin/bin/nargo" --version
          echo "NARGO=$PWD/.nargo-bin/bin/nargo" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

      # `cargo test` builds the test harnesses, not the binary itself; the
      # corpus step needs the binary.
      - run: cargo build --release

      - name: Corpus regression
        run: bash corpus/check_corpus.sh
        env:
          ADAPTER: ./target/release/noir-picus-adapter
