name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CVC5_VERSION: "1.3.1"
  # Must match the Noir revision `acir` is pinned to in Cargo.toml
  # (40d6574 = v1.0.0-beta.26), or artifacts fail to deserialize.
  NARGO_VERSION: "v1.0.0-beta.26"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      # Building cvc5 from source takes tens of minutes; the official static
      # release already carries CoCoA, which is all the finite-field backend
      # needs. Keep the version in step with `[package.metadata.cvc5]` in
      # `cvc5-ff-sys`.
      - name: Fetch prebuilt cvc5
        run: |
          set -euo pipefail
          archive="cvc5-Linux-x86_64-static-gpl"
          curl -sSfL -o cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/${archive}.zip"
          unzip -q cvc5.zip
          echo "CVC5_LIB_DIR=$PWD/${archive}/lib" >> "$GITHUB_ENV"
          echo "CVC5_INCLUDE_DIR=$PWD/${archive}/include" >> "$GITHUB_ENV"

      # The corpus scripts recompile Noir packages, so they need nargo.
      - name: Fetch nargo
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.nargo-bin"
          curl -sSfL -o nargo.tar.gz \
            "https://github.com/noir-lang/noir/releases/download/${NARGO_VERSION}/nargo-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf nargo.tar.gz -C "$PWD/.nargo-bin"
          "$PWD/.nargo-bin/nargo" --version
          echo "NARGO=$PWD/.nargo-bin/nargo" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

      - name: Corpus regression
        run: bash corpus/check_corpus.sh
        env:
          ADAPTER: ./target/release/noir-picus-adapter
