[package]
name = "noir-picus-adapter"
description = "Picus adapter for scanning Noir ACIR artifacts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"

[[bin]]
name = "noir-picus-adapter"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6"
flate2 = "1"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[dependencies.acir]
git = "https://github.com/noir-lang/noir.git"
rev = "40d6574f851d926f93e0c3a271bac3e6e82ac905"
package = "acir"

# Evaluates `POSEIDON2_PERMUTATION` when a witness is re-checked against the
# ACIR. Same Noir revision as `acir`, so the permutation is the one ACVM runs.
[dependencies.bn254_blackbox_solver]
git = "https://github.com/noir-lang/noir.git"
rev = "40d6574f851d926f93e0c3a271bac3e6e82ac905"
package = "bn254_blackbox_solver"

[dependencies.picus-smt]
git = "https://github.com/chyanju/picus.git"
rev = "7cb6d450a455bde7f447b831d79da343fa4ef084"
package = "picus-smt"
